[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cheesebench"
version = "0.2.0"
description = "CheeseBench: An LLM benchmark over 9 rodent behavioral neuroscience paradigms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CheeseBench Contributors" }]
keywords = [
    "benchmark",
    "vision-language-model",
    "vlm",
    "large-language-model",
    "llm",
    "llm",
    "evaluation",
    "neuroscience",
    "behavioral-neuroscience",
    "embodied-ai",
    "cognition",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "imageio>=2.30",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "requests>=2.31",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/stef41/CheeseBench"
Repository = "https://github.com/stef41/CheeseBench"
Issues = "https://github.com/stef41/CheeseBench/issues"

[project.scripts]
cheesebench = "cheesebench.benchmark:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"cheesebench.environments" = ["task_definitions.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cheesebench*"]

